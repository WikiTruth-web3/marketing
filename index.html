    <title>Wiki Truth is a decentralized whistleblower incentive and criminal evidence marketplace built on the Oasis Sapphire privacy-focused public blockchain. It allows users to anonymously mint sensitive evidence as digital assets called “Truth Boxes” and trade them. Its core innovation lies in the introduction of a delayed disclosure premium mechanism: if criminals wish to delay the public release of evidence, they must pay a delay fee that doubles annually—a requirement that would entail massive capital outlays. This mechanism ensures the certainty that “the truth will inevitably come to light” while also providing a potential external funding channel for Web3. By combining social justice with a token economic model, the project aims to break the traditional spiral of silence, providing a secure and sustainable anonymous monetization pathway for exposing corruption and crime. This enhances people’s willingness to participate in acts of justice while simultaneously addressing the real-world problem of whistleblower identity leaks.</title>
